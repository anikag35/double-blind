[project]
name = "double-blind"
version = "0.1.0"
description = "Double Blind: a distributed, fault-tolerant LLM evaluation platform"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.60",
    "grpcio-tools>=1.60",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["worker"]